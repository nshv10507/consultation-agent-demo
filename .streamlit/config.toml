[theme]
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#1f2937"
font = "sans serif"

[client]
showErrorDetails = false
showSidebarNavigation = false

[logger]
level = "warning"

[server]
# 認証なしで公開アクセス
headless = true
enableCORS = true
enableXsrfProtection = false
